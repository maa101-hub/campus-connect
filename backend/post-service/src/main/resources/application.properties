############################################
# SERVER CONFIG
############################################
server.port=${PORT:8082}

############################################
# APP NAME
############################################
spring.application.name=post-service

############################################
# DATABASE CONFIG (PostgreSQL)
############################################
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

############################################
# JPA / HIBERNATE
############################################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

############################################
# JWT CONFIG
############################################
jwt.secret=${JWT_SECRET}

############################################
# EUREKA CLIENT (optional)
############################################
# Routing no longer depends on Eureka (the API gateway was removed).
# Disabled by default so the service runs standalone (e.g. on Render).
# To re-enable, set EUREKA_ENABLED=true and provide EUREKA_URL.
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.register-with-eureka=${EUREKA_ENABLED:false}
eureka.client.fetch-registry=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# IMPORTANT FOR RENDER
eureka.instance.hostname=${RENDER_EXTERNAL_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false

############################################
# ACTUATOR / MONITORING
############################################
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

############################################
# LOGGING
############################################
logging.level.root=INFO
logging.level.com.campus.postservice=DEBUG

############################################
# FILE UPLOAD (media posts)
############################################
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

############################################
# JACKSON JSON CONFIG
############################################
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
