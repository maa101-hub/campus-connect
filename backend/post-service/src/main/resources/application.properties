############################################
# SERVER CONFIG
############################################
server.port=${POST_SERVICE_PORT:8082}

############################################
# APP NAME
############################################
spring.application.name=post-service

############################################
# DATABASE CONFIG (PostgreSQL)
############################################
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campus-connect}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:window}
spring.datasource.driver-class-name=org.postgresql.Driver

############################################
# JPA / HIBERNATE
############################################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

############################################
# JWT CONFIG (for token validation)
############################################
jwt.secret=${JWT_SECRET:DefaultDevSecretKey_ChangeInProduction_32chars}

############################################
# EUREKA CLIENT
############################################
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

############################################
# ACTUATOR / MONITORING
############################################
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

############################################
# LOGGING
############################################
logging.level.root=INFO
logging.level.com.campus.postservice=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

############################################
# FILE UPLOAD (media posts)
############################################
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

############################################
# JACKSON JSON CONFIG
############################################
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
