name: Campus Connect CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # ─── Frontend Build & Lint ────────────────────────────────
  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/campusconnect

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/campusconnect/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/campusconnect/dist
          retention-days: 7

  # ─── Discovery Server ────────────────────────────────────
  discovery-server:
    name: Discovery Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/discovery-server

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build & Test
        run: ./mvnw verify -B

  # ─── User Service ────────────────────────────────────────
  user-service:
    name: User Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/user-service

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: campus-connect-test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build & Test
        run: ./mvnw verify -B
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: campus-connect-test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: CI_TestSecretKey_MinimumThirtyTwoCharacters

  # ─── Post Service ────────────────────────────────────────
  post-service:
    name: Post Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/post-service

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: campus-connect-test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build & Test
        run: ./mvnw verify -B
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: campus-connect-test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: CI_TestSecretKey_MinimumThirtyTwoCharacters

  # ─── API Gateway ─────────────────────────────────────────
  api-gateway:
    name: API Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api-gateway

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build & Test
        run: ./mvnw verify -B

  # ─── Docker Compose Validation ───────────────────────────
  docker:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    needs: [frontend, discovery-server, user-service, post-service, api-gateway]

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Build all images
        run: docker compose build
